name: International language levels coverage

on:
  workflow_dispatch:  # disabled auto-triggers 2026-08-23, no GitHub Actions spend

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate all 104 language-level renderings
        run: node scripts/validate-international-language-levels.mjs
