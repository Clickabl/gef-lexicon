name: Lexicon integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate core lexicon integrity
        shell: bash
        run: |
          set +e
          output=$(node scripts/validate-lexicon.mjs 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$output"
            exit "$status"
          fi
      - name: Validate curriculum taxonomy
        shell: bash
        run: |
          set +e
          output=$(node scripts/validate-curriculum.mjs 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$output"
            exit "$status"
          fi
      - name: Validate lesson and construction graph
        shell: bash
        run: |
          set +e
          output=$(node scripts/validate-lessons.mjs 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$output"
            exit "$status"
          fi
      - name: Validate English source coverage
        run: npm run validate:english
      - name: Regenerate concept index
        run: npm run compile:concepts
      - name: Require generated concept index to be current
        run: git diff --exit-code -- concepts/compiled-concept-index.json
      - name: Compile development lexical SQLite fixtures
        run: npm run compile:sqlite
      - name: Compile development shared name index
        run: npm run compile:names
      - name: Compile production name index review gate
        run: npm run compile:names -- --production
