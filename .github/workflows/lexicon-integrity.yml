name: Lexicon integrity

on:
  pull_request:
  push:
    branches: [main, senses]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate Gef language identity contract
        run: node scripts/validate-language-contract.mjs
      - name: Validate core lexicon integrity
        shell: bash
        run: |
          set +e
          output=$(node scripts/validate-lexicon.mjs 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$output"
            exit "$status"
          fi
      - name: Validate multilingual sense/concept links
        run: npm run validate:sense-links
      - name: Validate curriculum taxonomy
        shell: bash
        run: |
          set +e
          output=$(node scripts/validate-curriculum.mjs 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$output"
            exit "$status"
          fi
      - name: Validate lesson and construction graph
        shell: bash
        run: |
          set +e
          output=$(node scripts/validate-lessons.mjs 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$output"
            exit "$status"
          fi
      - name: Validate universal lesson SSOT parity
        run: npm run validate:lesson-system
      - name: Validate Lesson 0 multilingual coverage
        run: npm run validate:lesson-zero
      - name: Validate multilingual lesson support blurbs
        run: node scripts/validate-lesson-support-blurbs.mjs
      - name: Validate lesson language capabilities and comparison records
        run: node scripts/validate-lesson-language-capabilities.mjs
      - name: Validate grammatical number lesson
        run: node scripts/validate-grammatical-number-lesson.mjs
      - name: Validate grammatical gender multilingual coverage
        run: npm run validate:grammatical-gender
      - name: Validate family-members multilingual coverage
        run: npm run validate:family-members
      - name: Validate calendar-year multilingual coverage
        run: npm run validate:calendar-year
      - name: Validate shared Lexi lesson semantic inputs
        run: npm run validate:semantic
      - name: Validate English source coverage
        run: npm run validate:english
      - name: Regenerate concept index
        run: npm run compile:concepts
      - name: Require generated concept index to be current
        run: git diff --exit-code -- concepts/compiled-concept-index.json
      - name: Test multilingual sense-link traversal
        run: npm run test:sense-links
      - name: Test translation usage compatibility gate
        run: npm run test:usage-compatibility
      - name: Compile development lexical SQLite fixtures
        run: npm run compile:sqlite
      - name: Compile deterministic v2 core packages
        run: npm run compile:core
      - name: Compile shared Lexi semantic lesson index
        run: npm run compile:semantic
      - name: Compile development shared name index
        run: npm run compile:names
      - name: Compile production name index review gate
        run: npm run compile:names -- --production
